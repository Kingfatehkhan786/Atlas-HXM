apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-service
  namespace: production
  labels:
    app: payroll-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payroll-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: payroll-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: payroll-service
          # Image tag is set to a commit SHA by CI — never use :latest in production.
          image: 123456789.dkr.ecr.us-east-1.amazonaws.com/payroll-service:REPLACE_WITH_SHA
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              value: "payroll-db.cluster-cxr3k8.us-east-1.rds.amazonaws.com"
            - name: DB_NAME
              value: "payroll"
            - name: DB_USER
              value: "payroll_admin"
            # Secrets are injected from a Kubernetes Secret — never hardcode credentials.
            # Create the secret out-of-band:
            #   kubectl create secret generic payroll-db-credentials \
            #     --from-literal=password='<value>' -n production
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payroll-db-credentials
                  key: password
            # Create with:
            #   kubectl create secret generic payroll-encryption \
            #     --from-literal=key='<value>' -n production
            - name: PAYROLL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: payroll-encryption
                  key: key
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
