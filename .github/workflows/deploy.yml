name: Deploy Payroll Service

on:
  push:
    branches:
      - main

# Minimal permissions — each job only gets what it needs.
# id-token:write is required for OIDC-based AWS credential federation.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: payroll-service
  EKS_CLUSTER_NAME: atlas-prod

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # Removed continue-on-error: true — a failing test suite must block deployment.
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        # npm ci: clean install, respects package-lock.json, faster and deterministic.
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # OIDC role federation — no long-lived static keys required.
          # Configure the IAM OIDC provider for GitHub Actions in AWS once,
          # then store the role ARN as AWS_DEPLOY_ROLE_ARN in repo secrets.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Use the commit SHA as the image tag — immutable, traceable, rollback-safe.
          IMAGE_TAG=${{ github.sha }}
          IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

  scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    # Removed continue-on-error: true — CRITICAL/HIGH CVEs must block deployment.
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image_uri }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, scan]
    # The "staging" GitHub Environment can have deployment protection rules
    # (e.g. wait timer, required status checks) configured in repo Settings.
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Deploy to Staging
        run: |
          kubectl set image deployment/payroll-service \
            payroll-service=${{ needs.build.outputs.image_uri }} \
            -n staging
          kubectl rollout status deployment/payroll-service \
            -n staging --timeout=300s

      - name: Smoke test staging
        run: |
          kubectl wait --for=condition=available \
            deployment/payroll-service -n staging --timeout=120s
          kubectl exec -n staging deployment/payroll-service -- \
            curl -sf http://localhost:3000/health

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    # The "production" GitHub Environment MUST be configured with at least one
    # required reviewer in repo Settings → Environments → production.
    # The workflow will pause here and wait for a human to approve in the
    # GitHub Actions UI before proceeding to the production deploy.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Deploy to Production
        run: |
          kubectl set image deployment/payroll-service \
            payroll-service=${{ needs.build.outputs.image_uri }} \
            -n production
          kubectl rollout status deployment/payroll-service \
            -n production --timeout=300s

      - name: Smoke test production
        run: |
          kubectl wait --for=condition=available \
            deployment/payroll-service -n production --timeout=120s
          kubectl exec -n production deployment/payroll-service -- \
            curl -sf http://localhost:3000/health
